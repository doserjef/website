[build]
  command = "hugo"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.125.7"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
command = 'hugo -F -b $DEPLOY_PRIME_URL'

[context.branch-deploy]
rommand = 'hugo -F -b $DEPLOY_PRIME_URL'
